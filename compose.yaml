services:
  postgres:
    image: postgres:16
    container_name: recupba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recupba
      POSTGRES_USER: recupba
      POSTGRES_PASSWORD: ${RECUPBA_DB_PASSWORD:?Define RECUPBA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - recupba_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recupba -d recupba"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  recupba_postgres_data:
